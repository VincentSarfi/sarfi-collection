# Prüfung bei jedem Pull Request und jedem Push auf main.
#
# 1. Docker-Build: dieselbe Prüfung, die Sliplane beim Deploy macht (npm ci,
#    Bildoptimierung, next build mit Typprüfung, Node-Version aus dem
#    Dockerfile). Die NEXT_PUBLIC_*-Build-Args fehlen hier bewusst, der Code
#    hat Rückfallwerte, und das Image wird verworfen.
# 2. Rauchtest: das gebaute Image starten und die wichtigsten Seiten abrufen.
#    Fängt, was der Build nicht sieht: ein Server, der nicht hochkommt, oder
#    eine Seite, die beim Rendern stirbt.
# 3. E2E-Rauchtest des Buchungswegs (M45): Playwright bucht mit Chromium
#    HAUS28 und zwei Schönblick-Apartments bis zum Zahlungsschritt und prüft
#    Preis und payment-intent-Daten. Alle API-Aufrufe und externen Dienste
#    sind Attrappen (e2e/attrappen.ts). Muss vor jeder Änderung am
#    Buchungsweg grün sein.
#
# Patch- und Minor-Updates von Dependabot werden nach grünem Build und
# E2E-Rauchtest automatisch gemergt (Vincents Vorgabe vom 26.10.2026: Website
# und Dashboard sollen ohne sein Zutun aktuell bleiben). Major-Updates
# bearbeitet eine wöchentliche Claude-Routine (claude.ai/code/routines): sie
# migriert auf dem Dependabot-Branch, prüft lokal und setzt im letzten Commit
# die Zeile „Routine-Freigabe: mergen“.
# Erst mit dieser Zeile mergt der Workflow auch ein Major. Der Merge mit
# dem GITHUB_TOKEN löst keinen weiteren Workflow aus, Sliplane bekommt den
# Push aber wie jeden anderen und deployt.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker-Build und Rauchtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Image bauen wie auf Sliplane
        run: docker build --pull --tag sarfi-collection:pruefung .
      - name: Container starten und Seiten abrufen
        run: |
          docker run -d --rm --name pruefung -p 3000:3000 sarfi-collection:pruefung
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/robots.txt && break
            sleep 1
          done
          fehler=0
          for pfad in / /haus28 /haus28/buchen /schoenblick /schoenblick/buchen /schoenblick/gruppen /gutschein /blog /ausflugsziele /late-checkout /meldeschein /en /en/haus28 /sitemap.xml /robots.txt /opengraph-image; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$pfad")
            echo "$code $pfad"
            [ "$code" = "200" ] || fehler=1
          done
          if [ "$fehler" != 0 ]; then
            echo "::group::Container-Log"
            docker logs pruefung 2>&1 | tail -50
            echo "::endgroup::"
          fi
          docker stop pruefung >/dev/null
          exit $fehler

  e2e:
    name: E2E-Rauchtest des Buchungswegs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Hauptversion wie im Dockerfile
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Buchungsweg durchklicken
        run: npm run e2e
      - name: Spuren der fehlgeschlagenen Tests sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-spuren
          path: test-results/
          retention-days: 7

  auto-merge:
    name: Dependabot-Update mergen
    needs: [build, e2e]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Art des Updates ermitteln
        id: meta
        uses: dependabot/fetch-metadata@v3
        continue-on-error: true
      - name: Freigabe der Major-Routine lesen
        id: routine
        run: |
          nachricht=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.message)
          if printf '%s' "$nachricht" | grep -q "Routine-Freigabe: mergen"; then
            echo "freigabe=ja" >> "$GITHUB_OUTPUT"
          else
            echo "freigabe=nein" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Mergen, wenn Patch, Minor oder von der Routine freigegebenes Major
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.meta.outputs.update-type) || steps.routine.outputs.freigabe == 'ja'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Hinweis
        if: "!(contains(fromJSON('[\"version-update:semver-patch\",\"version-update:semver-minor\"]'), steps.meta.outputs.update-type) || steps.routine.outputs.freigabe == 'ja')"
        run: echo "Major-Update ohne Freigabe der Routine (${{ steps.meta.outputs.update-type }}), bleibt offen."
