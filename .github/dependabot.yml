# Dependabot hält die npm-Pakete, die Node-Version im Dockerfile und die
# GitHub-Actions aktuell. Eingerichtet am 26.10.2026 nach PHP2Shell.
#
# Zusammenspiel mit .github/workflows/pruefung.yml: Patch- und Minor-Updates
# werden nach grünem Docker-Build und Rauchtest automatisch gemergt und damit
# über Sliplane deployt. Major-Updates bleiben Handarbeit (PR ansehen, mergen).
#
# Sicherheitsupdates laufen unabhängig von diesem Zeitplan: sobald GitHub eine
# Warnung zu einem Paket kennt, öffnet Dependabot sofort einen PR dafür.
version: 2
updates:
  # npm-Pakete (package.json und package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Ein Sammel-PR für alle Patches, einer für alle Minors, beide werden
    # automatisch gemergt. Getrennt, damit ein hakender Minor die Patches
    # nicht aufhält. Majors kommen einzeln.
    groups:
      patches:
        patterns: ["*"]
        update-types: [patch]
      minors:
        patterns: ["*"]
        update-types: [minor]
    open-pull-requests-limit: 10

  # Node-Basisimage im Dockerfile (alle drei FROM-Zeilen). Täglich, weil
  # Node-Sicherheitsreleases nicht über Dependabot-Warnungen kommen.
  # Kein Sprung auf eine neue Major-Version (22 auf 24 oder höher): das ist
  # eine bewusste Entscheidung, siehe Kommentar im Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Die Actions in den Workflows selbst (actions/checkout usw.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
